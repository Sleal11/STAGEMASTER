<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <!--
    station.html — Estación operadora (solo en el portátil)

    Desde aquí el moderador controla:
      - Los DOS partidos: marcador, pausa, finalizar, reiniciar, PIN/QR y
        teléfono del árbitro, y puntuación de respaldo
      - El HISTORIAL de partidos terminados (búsqueda por fecha, pista y jugador)
      - Las DOS pantallas: qué muestran (marcador o publicidad y vídeos),
        reproductor, cinta publicitaria, lista de reproducción, publicidad al
        terminar el partido, monitor y formato de salida (LED 832×416 / 416×208)

    Relación con otros archivos:
      → css/shared.css · css/station.css
      → js/station/main.js (módulos ES) · img/icons.svg
      ← server/realtime/socketServer.js ('stationState' y eventos station:*)
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StageMaster · Estación operadora</title>
  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/station.css" />
</head>
<body class="station-body">

  <!-- ── Barra superior ─────────────────────────────────────────── -->
  <header class="st-top">
    <div class="st-brand">
      <div class="st-logo" data-brand-logo>STAGE<span>MASTER</span></div>
      <div class="st-title">Estación operadora <span id="st-build" class="st-build" title="Versión de StageMaster que está funcionando"></span></div>
    </div>
    <nav class="st-views" role="tablist" aria-label="Secciones">
      <button type="button" role="tab" class="st-view-tab is-active" data-view="panel" aria-selected="true">
        <svg class="icon"><use href="img/icons.svg#scoreboard"></use></svg>Panel
      </button>
      <button type="button" role="tab" class="st-view-tab" data-view="history" aria-selected="false">
        <svg class="icon"><use href="img/icons.svg#history"></use></svg>Historial
      </button>
    </nav>
    <div id="st-network" class="st-network"></div>
    <div class="st-top-actions">
      <button id="st-open-ads" class="btn btn-ghost hidden" type="button">
        <svg class="icon"><use href="img/icons.svg#folder"></use></svg>Carpeta de publicidad
      </button>
      <button id="st-help" class="btn btn-ghost" type="button">
        <svg class="icon"><use href="img/icons.svg#help"></use></svg>Ayuda
      </button>
    </div>
    <div class="st-conn" role="status">
      <span id="st-conn-dot" class="dot"></span>
      <span id="st-conn-text">Conectando…</span>
    </div>
  </header>

  <!-- Aviso si no se puede usar la estación -->
  <div id="st-blocked" class="st-blocked hidden"></div>

  <main id="view-panel" class="st-main">
    <section class="st-section">
      <div class="st-section-head">
        <h2 class="st-section-title">Partidos</h2>
      </div>
      <div id="st-matches" class="st-grid"></div>
    </section>

    <section class="st-section">
      <div class="st-section-head">
        <h2 class="st-section-title">Pantallas</h2>
        <div class="st-section-actions">
          <button id="st-add-screen" class="btn btn-secondary btn-sm" type="button">
            <svg class="icon"><use href="img/icons.svg#plus"></use></svg>Añadir pantalla
          </button>
          <button id="st-refresh-ads" class="btn btn-ghost btn-sm" type="button">
            <svg class="icon"><use href="img/icons.svg#refresh"></use></svg>Actualizar publicidad
          </button>
        </div>
      </div>
      <div id="st-screens" class="st-grid"></div>
    </section>
  </main>

  <!-- ── Historial de partidos ───────────────────────────────────── -->
  <main id="view-history" class="st-main hidden">
    <section class="st-section">
      <div class="st-section-head">
        <h2 class="st-section-title">Historial de partidos</h2>
        <button id="hist-export" class="btn btn-ghost btn-sm" type="button">
          <svg class="icon"><use href="img/icons.svg#download"></use></svg>Exportar CSV
        </button>
      </div>
      <div class="hist-filters">
        <div id="hist-quick" class="segmented" role="group" aria-label="Periodo">
          <button type="button" data-quick="today" class="is-active">Hoy</button>
          <button type="button" data-quick="yesterday">Ayer</button>
          <button type="button" data-quick="7">7 días</button>
          <button type="button" data-quick="30">30 días</button>
          <button type="button" data-quick="all">Todo</button>
        </div>
        <label class="hist-field"><span>Desde</span><input id="hist-from" class="input" type="date" /></label>
        <label class="hist-field"><span>Hasta</span><input id="hist-to" class="input" type="date" /></label>
        <label class="hist-field"><span>Pista</span><select id="hist-court" class="input"><option value="">Todas</option></select></label>
        <label class="hist-field hist-search"><span>Jugador</span>
          <input id="hist-text" class="input" type="search" maxlength="80" placeholder="Buscar por nombre…" autocomplete="off" /></label>
      </div>
      <p id="hist-summary" class="hist-summary"></p>
      <div id="hist-list" class="hist-list"></div>
    </section>
  </main>

  <!-- ── Diálogo: detalle de un partido del historial ─────────────── -->
  <dialog id="dlg-match" class="st-dialog">
    <div id="dlg-match-body"></div>
    <div class="st-dialog-actions">
      <button type="button" id="dlg-match-close" class="btn btn-primary">Cerrar</button>
    </div>
  </dialog>

  <!-- ── Diálogo: configurar partido ─────────────────────────────── -->
  <dialog id="dlg-setup" class="st-dialog">
    <form id="form-setup" method="dialog">
      <h3 id="dlg-setup-title" class="st-dialog-title">Configurar partido</h3>

      <div class="st-form-grid">
        <fieldset>
          <legend>Pareja A</legend>
          <input name="a1" maxlength="24" placeholder="Jugador 1 (ej: Jose V)" required autocomplete="off" />
          <input name="a2" maxlength="24" placeholder="Jugador 2 (ej: Santiago R)" autocomplete="off" />
        </fieldset>
        <fieldset>
          <legend>Pareja B</legend>
          <input name="b1" maxlength="24" placeholder="Jugador 1" required autocomplete="off" />
          <input name="b2" maxlength="24" placeholder="Jugador 2" autocomplete="off" />
        </fieldset>
      </div>

      <div class="st-form-grid st-form-grid-3">
        <label>Games por set
          <select name="gamesPerSet">
            <option>1</option><option>2</option><option>3</option>
            <option>4</option><option>5</option><option selected>6</option>
          </select>
        </label>
        <label>Sets
          <select name="totalSets">
            <option>1</option><option selected>3</option><option>5</option>
          </select>
        </label>
        <label>Saque inicial
          <select name="initialServer">
            <option value="A">Pareja A</option><option value="B">Pareja B</option>
          </select>
        </label>
        <label>Puntuación
          <select name="scoringSystem">
            <option value="advantage">Ventaja</option>
            <option value="goldenPoint">Punto de oro</option>
            <option value="starPoint">Punto Estrella (FIP 2026)</option>
          </select>
        </label>
        <label>Desempate
          <select name="tiebreakType">
            <option value="tiebreak">Tie Break</option>
            <option value="superTiebreak">Súper Tie Break</option>
            <option value="none">Ninguno</option>
          </select>
        </label>
      </div>

      <p id="scoring-help" class="st-scoring-help"></p>

      <div id="dlg-setup-error" class="st-error hidden" role="alert"></div>

      <div class="st-dialog-actions">
        <button type="button" id="dlg-setup-cancel" class="btn btn-ghost">Cancelar</button>
        <button type="submit" class="btn btn-primary">
          <svg class="icon"><use href="img/icons.svg#play"></use></svg>Iniciar partido
        </button>
      </div>
    </form>
  </dialog>

  <!-- ── Diálogo: confirmación ───────────────────────────────────── -->
  <dialog id="dlg-confirm" class="st-dialog st-dialog-small">
    <h3 id="dlg-confirm-title" class="st-dialog-title"></h3>
    <p id="dlg-confirm-message" class="st-dialog-message"></p>
    <div class="st-dialog-actions">
      <button type="button" id="dlg-confirm-cancel" class="btn btn-ghost">Cancelar</button>
      <button type="button" id="dlg-confirm-ok" class="btn btn-danger">Confirmar</button>
    </div>
  </dialog>

  <div id="st-toast" class="st-toast hidden" role="status" aria-live="polite"></div>

  <!-- Subida de publicidad: selector de archivos y progreso -->
  <input id="st-file" type="file" multiple hidden
    accept="image/png,image/jpeg,image/webp,image/svg+xml,video/mp4,video/webm,.png,.jpg,.jpeg,.webp,.svg,.mp4,.m4v,.webm" />
  <div id="st-upload" class="st-upload hidden" role="status" aria-live="polite">
    <div class="st-upload-text"><span data-part="name"></span><strong data-part="percent"></strong></div>
    <div class="st-upload-track"><div class="st-upload-bar" data-part="bar"></div></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="js/station/main.js"></script>
</body>
</html>
