<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <!--
    score.html — Pantalla de score y publicidad (vista del público)

    Se abre una ventana por pantalla física (monitor o pantalla LED):
      score.html?pantalla=1   →  Pantalla 1
      score.html?pantalla=2   →  Pantalla 2

    Qué partido muestra, la cinta publicitaria, la lista de reproducción
    (imágenes y vídeos), la publicidad al terminar y el formato de salida
    (monitor completo o LED 832×416 / 416×208) los decide la ESTACIÓN en
    vivo: esta página nunca necesita reiniciarse.

    Sin botones, menús ni enlaces: solo lo que ve el público.

    Relación con otros archivos:
      → css/shared.css · css/score.css      estilos
      → js/display/main.js                  conexión y capas (módulos ES)
      → img/icons.svg                       pelota de saque y estrella
      ← server/realtime/socketServer.js     'screenConfig', 'matchUpdate', 'identify'
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#041024" />
  <title>StageMaster · Pantalla</title>
  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/score.css" />
</head>
<body class="score-body">

<!-- Caja de salida: todo el monitor o el formato LED exacto -->
<div id="output" class="output">
<main id="display" class="display">

  <!-- ── Cabecera: logo (izquierda) · estado + pista (derecha) ── -->
  <header class="d-header">
    <div class="d-logo" data-brand-logo>STAGE<span>MASTER</span></div>
    <div class="d-header-right">
      <div id="d-badge" class="d-badge hidden"></div>
      <div id="d-court" class="d-court"></div>
    </div>
  </header>

  <!-- ── Zona del marcador ─────────────────────────────────────── -->
  <section id="d-stage" class="d-stage">

    <!-- Sin partido (y sin lista de reproducción) -->
    <div id="d-waiting" class="d-waiting">
      <div id="d-waiting-court" class="d-waiting-court"></div>
      <div class="d-waiting-text">Próximo partido</div>
    </div>

    <!-- Marcador -->
    <div id="d-board" class="d-board hidden">
      <div class="d-head">
        <span></span><span></span><span>SETS</span><span>GAMES</span><span>PUNTOS</span>
      </div>

      <div id="row-a" class="d-row">
        <span class="d-icon">
          <svg class="icon-ball"><use href="img/icons.svg#ball"></use></svg>
          <svg class="icon-star"><use href="img/icons.svg#star"></use></svg>
        </span>
        <span id="names-a" class="d-names"></span>
        <span id="sets-a" class="d-cell d-sets"></span>
        <span id="games-a" class="d-cell d-games"></span>
        <span id="pts-a" class="d-cell d-pts"></span>
      </div>

      <div class="d-divider"><span id="d-divider-label" class="d-divider-label"></span></div>

      <div id="row-b" class="d-row">
        <span class="d-icon">
          <svg class="icon-ball"><use href="img/icons.svg#ball"></use></svg>
          <svg class="icon-star"><use href="img/icons.svg#star"></use></svg>
        </span>
        <span id="names-b" class="d-names"></span>
        <span id="sets-b" class="d-cell d-sets"></span>
        <span id="games-b" class="d-cell d-games"></span>
        <span id="pts-b" class="d-cell d-pts"></span>
      </div>

      <div id="d-history" class="d-history"></div>
    </div>
  </section>

  <!-- ── Cinta publicitaria (parte del marcador) ───────────────── -->
  <footer id="d-ribbon" class="d-ribbon hidden"></footer>

  <!-- ── Lista de reproducción a pantalla completa ─────────────── -->
  <div id="d-media" class="d-media hidden"></div>

  <!-- ── Logo: lista vacía o sin archivos reproducibles ────────── -->
  <div id="d-standby" class="d-standby hidden">
    <div class="d-standby-logo" data-brand-logo>STAGE<span>MASTER</span></div>
  </div>

  <!-- Identificación (la estación pulsa "Identificar") -->
  <div id="d-identify" class="d-identify hidden"></div>
</main>
</div>

<script src="/socket.io/socket.io.js"></script>
<script type="module" src="js/display/main.js"></script>
</body>
</html>
