# Compila StageMaster.exe (aplicación portable para Windows).
#
# Cuándo se ejecuta:
#   - Al subir cambios a main o a las ramas de trabajo (claude/...)
#   - Manualmente: pestaña "Actions" → "StageMaster para Windows" → "Run workflow"
#   - Al crear una versión con etiqueta (ej. v2.1.0): además publica el .exe
#     en la sección "Releases" del repositorio (versión para el cliente)
#
# Dónde se descarga el .exe:
#   - VERSIÓN DE PRUEBA (cada cambio, sin iniciar sesión, enlace fijo):
#       https://github.com/Sleal11/STAGEMASTER/releases/download/prueba/StageMaster-prueba.exe
#     Es una "pre-release": el enlace del cliente (releases/latest) no cambia.
#   - Actions → la ejecución → "Artifacts" → StageMaster-Windows
#   - Versión para el cliente: Releases (etiquetas v*)
#
# Se compila en Windows real: así el ejecutable lleva su icono y las pruebas
# se ejecutan también en Windows antes de generarlo.

name: StageMaster para Windows

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']

permissions:
  contents: write

# Si se suben dos cambios seguidos, solo cuenta el último
concurrency:
  group: stagemaster-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas (motor, núcleo, monitores, integración)
        run: npm test

      # Resoluciones de Windows: compila y prueba el código de Windows real (sin cambiar la pantalla)
      - name: Pruebas de resoluciones de Windows
        run: node desktop/displayModes.win.test.js

      # Firewall de Windows: diagnóstico y «Permitir teléfonos» (crea y borra las reglas)
      - name: Pruebas del firewall de Windows
        run: node desktop/firewall.win.test.js

      # Versión exacta dentro del .exe (la estación la muestra: "v2.2.0 · 19c768c")
      - name: Datos de la compilación
        shell: bash
        run: |
          echo "{\"commit\":\"${GITHUB_SHA::7}\",\"date\":\"$(date -u +'%Y-%m-%d %H:%M UTC')\"}" > build-info.json
          cat build-info.json

      - name: Compilar StageMaster.exe
        run: npm run dist:win

      # También en .zip (con instrucciones dentro): los navegadores bloquean
      # mucho menos un .zip que un .exe sin firma digital
      - name: Preparar el .zip
        shell: bash
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist/zip
          cp dist/StageMaster-$VERSION.exe dist/zip/StageMaster.exe
          cp "build/LEEME-si-Windows-avisa.txt" dist/zip/
          powershell -NoProfile -Command "Compress-Archive -Path 'dist/zip/*' -DestinationPath 'dist/StageMaster-$VERSION.zip' -Force"
          ls -la dist/*.zip

      - name: Guardar el ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: StageMaster-Windows
          path: |
            dist/*.exe
            dist/*.zip
          retention-days: 30

      # Versión de prueba: la etiqueta se mueve a este commit y su .exe se
      # sustituye; el enlace de descarga nunca cambia. PRUEBA_TAG elige el
      # enlace: "prueba" (habitual) o "prueba-nueva" mientras se valida una
      # versión grande, para conservar la anterior en "prueba".
      - name: Publicar la versión de prueba
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRUEBA_TAG: prueba-nueva
        run: |
          set -e
          cp dist/StageMaster-*.exe "dist/StageMaster-$PRUEBA_TAG.exe"
          cp dist/StageMaster-*.zip "dist/StageMaster-$PRUEBA_TAG.zip"
          VERSION=$(node -p "require('./package.json').version")
          FECHA=$(date -u +'%Y-%m-%d %H:%M UTC')
          git tag -f "$PRUEBA_TAG"
          git push -f origin "refs/tags/$PRUEBA_TAG"
          NOTAS="Versión de PRUEBA $VERSION · rama ${GITHUB_REF_NAME} · commit ${GITHUB_SHA::7} · $FECHA. Se actualiza sola con cada cambio. Si el navegador bloquea el .exe, descarga el .zip (lleva instrucciones dentro). Para el cliente, usar la última versión de Releases."
          if gh release view "$PRUEBA_TAG" >/dev/null 2>&1; then
            gh release edit "$PRUEBA_TAG" --prerelease --title "StageMaster · versión de prueba ($VERSION)" --notes "$NOTAS"
            gh release upload "$PRUEBA_TAG" "dist/StageMaster-$PRUEBA_TAG.exe" "dist/StageMaster-$PRUEBA_TAG.zip" --clobber
          else
            gh release create "$PRUEBA_TAG" "dist/StageMaster-$PRUEBA_TAG.exe" "dist/StageMaster-$PRUEBA_TAG.zip" --prerelease --latest=false \
              --title "StageMaster · versión de prueba ($VERSION)" --notes "$NOTAS"
          fi
          # Vídeos explicativos (marketing/tutoriales): enlaces fijos de descarga junto al .exe.
          # Solo se suben los que cambiaron (mismo tamaño = mismo vídeo) y un fallo aquí no
          # invalida el .exe ya publicado
          for f in marketing/tutoriales/*.mp4; do
            name=$(basename "$f")
            local_size=$(stat -c %s "$f" 2>/dev/null || wc -c < "$f")
            remote_size=$(gh release view "$PRUEBA_TAG" --json assets --jq ".assets[] | select(.name==\"$name\") | .size" || echo "")
            if [ "$local_size" != "$remote_size" ]; then
              gh release upload "$PRUEBA_TAG" "$f" --clobber || echo "Aviso: no se pudo subir $name"
            fi
          done

      - name: Publicar en Releases (solo con etiqueta v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: StageMaster ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.zip
          body: |
            ## Descargar y usar

            1. Descarga **StageMaster-….zip** (abajo, en *Assets*); si el navegador deja, también vale el **.exe**. No se instala nada.
            2. Extrae **StageMaster.exe** del .zip, cópialo a la laptop del evento y ábrelo con doble clic.
            3. Si Windows avisa *"Windows protegió su PC"*: **Más información → Ejecutar de todas formas**. Si no deja: clic derecho → Propiedades → **Desbloquear**.
            4. Si pregunta por el **Firewall**: **Permitir** (redes privadas), para que se conecten los teléfonos.

            Todo lo demás está en el botón **❔ Ayuda** de la estación.
