# Compila StageMaster.exe (aplicación portable para Windows).
#
# Cuándo se ejecuta:
#   - Al subir cambios a main o a las ramas de trabajo (claude/...)
#   - Manualmente: pestaña "Actions" → "StageMaster para Windows" → "Run workflow"
#   - Al crear una versión con etiqueta (ej. v2.1.0): además publica el .exe
#     en la sección "Releases" del repositorio (versión para el cliente)
#
# Dónde se descarga el .exe:
#   - VERSIÓN DE PRUEBA (cada cambio, sin iniciar sesión, enlace fijo):
#       https://github.com/Sleal11/STAGEMASTER/releases/download/prueba/StageMaster-prueba.exe
#     Es una "pre-release": el enlace del cliente (releases/latest) no cambia.
#   - Actions → la ejecución → "Artifacts" → StageMaster-Windows
#   - Versión para el cliente: Releases (etiquetas v*)
#
# Se compila en Windows real: así el ejecutable lleva su icono y las pruebas
# se ejecutan también en Windows antes de generarlo.

name: StageMaster para Windows

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']

permissions:
  contents: write

# Si se suben dos cambios seguidos, solo cuenta el último
concurrency:
  group: stagemaster-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas (motor, núcleo, monitores, integración)
        run: npm test

      # Versión exacta dentro del .exe (la estación la muestra: "v2.2.0 · 19c768c")
      - name: Datos de la compilación
        shell: bash
        run: |
          echo "{\"commit\":\"${GITHUB_SHA::7}\",\"date\":\"$(date -u +'%Y-%m-%d %H:%M UTC')\"}" > build-info.json
          cat build-info.json

      - name: Compilar StageMaster.exe
        run: npm run dist:win

      - name: Guardar el ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: StageMaster-Windows
          path: dist/*.exe
          retention-days: 30

      # Versión de prueba: la etiqueta "prueba" se mueve a este commit y su
      # .exe se sustituye. El enlace de descarga nunca cambia.
      - name: Publicar la versión de prueba
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp dist/StageMaster-*.exe dist/StageMaster-prueba.exe
          VERSION=$(node -p "require('./package.json').version")
          FECHA=$(date -u +'%Y-%m-%d %H:%M UTC')
          git tag -f prueba
          git push -f origin refs/tags/prueba
          NOTAS="Versión de PRUEBA $VERSION · rama ${GITHUB_REF_NAME} · commit ${GITHUB_SHA::7} · $FECHA. Se actualiza sola con cada cambio. Para el cliente, usar la última versión de Releases."
          if gh release view prueba >/dev/null 2>&1; then
            gh release edit prueba --prerelease --title "StageMaster · versión de prueba ($VERSION)" --notes "$NOTAS"
            gh release upload prueba dist/StageMaster-prueba.exe --clobber
          else
            gh release create prueba dist/StageMaster-prueba.exe --prerelease --latest=false \
              --title "StageMaster · versión de prueba ($VERSION)" --notes "$NOTAS"
          fi

      - name: Publicar en Releases (solo con etiqueta v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: StageMaster ${{ github.ref_name }}
          files: dist/*.exe
          body: |
            ## Descargar y usar

            1. Descarga **StageMaster-….exe** (abajo, en *Assets*). No se instala nada.
            2. Cópialo a la laptop del evento y ábrelo con doble clic.
            3. Si Windows avisa *"Windows protegió su PC"*: **Más información → Ejecutar de todas formas**.
            4. Si pregunta por el **Firewall**: **Permitir** (redes privadas), para que se conecten los teléfonos.

            Todo lo demás está en el botón **❔ Ayuda** de la estación.
