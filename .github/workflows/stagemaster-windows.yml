# Compila StageMaster.exe (aplicación portable para Windows).
#
# Cuándo se ejecuta:
#   - Al subir cambios a main o a las ramas de trabajo (claude/...)
#   - Manualmente: pestaña "Actions" → "StageMaster para Windows" → "Run workflow"
#   - Al crear una versión con etiqueta (ej. v2.0.0): además publica el .exe
#     en la sección "Releases" del repositorio
#
# Dónde se descarga el .exe:
#   Actions → la ejecución más reciente → "Artifacts" → StageMaster-Windows
#
# Se compila en Windows real: así el ejecutable lleva su icono y las pruebas
# se ejecutan también en Windows antes de generarlo.

name: StageMaster para Windows

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas (motor, núcleo, monitores, integración)
        run: npm test

      - name: Compilar StageMaster.exe
        run: npm run dist:win

      - name: Guardar el ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: StageMaster-Windows
          path: dist/*.exe
          retention-days: 30

      - name: Publicar en Releases (solo con etiqueta v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: StageMaster ${{ github.ref_name }}
          files: dist/*.exe
          body: |
            ## Descargar y usar

            1. Descarga **StageMaster-….exe** (abajo, en *Assets*). No se instala nada.
            2. Cópialo a la laptop del evento y ábrelo con doble clic.
            3. Si Windows avisa *"Windows protegió su PC"*: **Más información → Ejecutar de todas formas**.
            4. Si pregunta por el **Firewall**: **Permitir** (redes privadas), para que se conecten los teléfonos.

            Todo lo demás está en el botón **❔ Ayuda** de la estación.
